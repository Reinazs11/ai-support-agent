name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EMBEDDING_PROVIDER: disabled
      CHAT_PROVIDER: disabled
      OPENAI_API_KEY: ""
      EMBEDDING_API_KEY: ""
      CHAT_API_KEY: ""
      N8N_WEBHOOK_MODE: simulated
      N8N_WEBHOOK_REQUIRES_HUMAN_APPROVAL: "true"
      LANGFUSE_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: python -m compileall app scripts tests

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile -t rag-support-agent:ci .
